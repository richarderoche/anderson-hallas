{{if crop=="portrait"}}
<picture class='img load ratio r-portrait'>
  <source media='(min-width: 1441px)' srcset='{{ glide:url width="840" height="1260" quality="75" fit="crop_focal" }}'>
  <source media='(min-width: 680px)' srcset='{{ glide:url width="640" height="960" quality="75" fit="crop_focal" }}'>
  <source srcset='{{ glide:url width="400" height="600" quality="80" fit="crop_focal" }}'>
  <img alt='{{ alt ?? title ?? page:title }}' srcset='{{ glide:url width="400" height="600" quality="80" fit="crop_focal" }}'>
</picture>
{{else}}
<picture class='img load ratio r-square'>
  <source media='(min-width: 1441px)' srcset='{{ glide:url width="840" height="840" quality="75" fit="crop_focal" }}'>
  <source media='(min-width: 680px)' srcset='{{ glide:url width="640" height="640" quality="75" fit="crop_focal" }}'>
  <source srcset='{{ glide:url width="400" height="400" quality="80" fit="crop_focal" }}'>
  <img alt='{{ alt ?? title ?? page:title }}' srcset='{{ glide:url width="400" height="400" quality="80" fit="crop_focal" }}'>
</picture>
{{/if}}
