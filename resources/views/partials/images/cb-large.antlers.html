<picture class='img'>
  <source media='(min-width: 1441px)' srcset='{{ glide:url width="1800" quality="75" }}'>
  <source media='(min-width: 680px)' srcset='{{ glide:url width="1360" quality="75" }}'>
  <source srcset='{{ glide:url width="960" quality="80" }}'>
  <img alt='{{ alt ?? title ?? page:title }}' srcset='{{ glide:url width="960" quality="80" }}'>
</picture>
